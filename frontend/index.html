<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Agent · Prompt Harness</title>
<style>
:root{color-scheme:dark;--bg:#09111f;--panel:#111d31;--line:#263650;--text:#edf3ff;--muted:#96a7c2;--accent:#72e4b8;--blue:#73a7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17345a 0,transparent 35%),var(--bg);font:14px/1.45 Inter,system-ui;color:var(--text)}
main{max-width:1380px;margin:auto;padding:20px 22px 90px}.eyebrow{color:var(--accent);letter-spacing:.15em;text-transform:uppercase;font-size:11px}h1{font-size:30px;margin:4px 0}h2{font-size:16px;margin:0 0 10px}p,.muted{color:var(--muted)}
.workspace{display:grid;grid-template-columns:1fr 1fr 310px;gap:14px;margin-top:16px}.panel,details{background:#111d31ed;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 15px 40px #0004}
.basics{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1.2fr;gap:10px;align-items:end}.materials{min-height:390px}.side{display:flex;flex-direction:column;gap:10px}
label{display:block;margin:8px 0 5px;color:#cbd7ea;font-size:12px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0b1526;color:var(--text);padding:9px;outline:none}textarea{min-height:250px;resize:vertical}.compact{min-height:90px}.upload{font-size:11px;padding:6px}
details{padding:11px}summary{cursor:pointer;font-weight:700}details textarea{min-height:92px}button{border:0;border-radius:9px;background:linear-gradient(135deg,var(--accent),#55aaff);color:#07121e;font-weight:800;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5}
.actionbar{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#09111fef;border-top:1px solid var(--line);padding:11px 24px;display:flex;justify-content:flex-end;gap:12px}.actionbar button{min-width:180px}
.results{margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric{background:#0b1526;border:1px solid var(--line);border-radius:10px;padding:10px}.metric strong{display:block;font-size:22px;color:var(--accent)}
pre{white-space:pre-wrap;word-break:break-word;background:#0a1424;border-radius:10px;padding:13px;max-height:420px;overflow:auto}.progress-card{margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1526}.progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress-track{height:8px;background:#17253b;border-radius:8px;overflow:hidden;margin:10px 0}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .3s}.stage-list{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stage{padding:7px;border-radius:8px;color:var(--muted);font-size:11px;border:1px solid transparent}.stage.running{color:var(--text);border-color:var(--accent);animation:pulse 1.8s ease-in-out infinite}.stage.completed{color:var(--accent)}.stage.failed{color:#ff7d8b;border-color:#ff7d8b}.stage-icon{font-size:15px;margin-right:4px}@keyframes pulse{50%{box-shadow:0 0 0 3px #72e4b833}}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:12px}.hidden{display:none}.history-item{display:flex;flex-direction:column;width:100%;text-align:left;margin:6px 0;background:#0b1526;color:var(--text);border:1px solid var(--line)}.history-item span{color:var(--muted);font-size:11px}
@media(max-width:1000px){.stage-list{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr 1fr}.side{grid-column:1/-1}.basics{grid-template-columns:1fr 1fr 1fr}}@media(max-width:650px){.workspace,.basics{grid-template-columns:1fr}.materials{min-height:0}}
</style></head><body><main>
<div class="eyebrow">Multi-Agent Resume Intelligence</div>
<h1>把真实经历，写成经得起 HR 审视的简历。</h1>
<div class="workspace">
<section class="panel basics"><div><label>岗位分类</label><select id="category"><option>互联网产品经理</option><option>硬件产品经理</option><option>机械/风电塔相关</option><option>BD（商务拓展）</option><option>其他</option></select></div><div><label>会话标识</label><input id="session" value="web" maxlength="100"></div><div><label>迭代轮次（1–10）</label><input id="iterations" type="number" min="1" max="10" value="3"></div><div><label>编造容忍度（0–60%）</label><input id="tolerance" type="number" min="0" max="60" value="0"></div><div><label>访问口令</label><input id="token" type="password" autocomplete="off" placeholder="APP_ACCESS_TOKEN"></div></section>
<section class="panel materials"><h2>岗位 JD</h2><input class="upload" id="jdFile" type="file" accept=".txt,.md,text/plain,text/markdown"><textarea id="jd" placeholder="粘贴或上传完整岗位描述；上传后仍可编辑"></textarea></section>
<section class="panel materials"><h2>已有经历</h2><input class="upload" id="experienceFile" type="file" accept=".txt,.md,text/plain,text/markdown"><textarea id="experience" placeholder="粘贴或上传真实的项目、实习、工作经历"></textarea></section>
<section class="side">
<details open><summary>补充材料</summary><label>关联内容</label><input class="upload" id="relatedFile" type="file" multiple accept=".txt,.md"><textarea class="compact" id="related" placeholder="补充背景、关联项目或上下文"></textarea><label>优秀简历参考（可多选文件）</label><input class="upload" id="referenceFiles" type="file" multiple accept=".txt,.md"><textarea class="compact" id="references" placeholder="每份上传文件会保留清晰边界"></textarea><label>Anchor Content（可选，不可压缩内容）</label><textarea class="compact" id="anchor"></textarea></details>
<details><summary>优化规则</summary><label>人工规则（可选，优先执行但不违反核心原则）</label><textarea class="compact" id="rules"></textarea></details>
<details open><summary>会话历史</summary><button id="historyButton" type="button">查询当前会话</button><div id="history"></div></details>
</section></div>
<section id="resultPanel" class="panel results hidden"><div class="progress-card"><div class="progress-head"><strong id="progressStage">&#x7B49;&#x5F85;&#x4EFB;&#x52A1;</strong><span id="elapsed">0s</span></div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div><div id="progressMessage" class="muted">&#x63D0;&#x4EA4;&#x4EFB;&#x52A1;&#x540E;&#x663E;&#x793A;&#x771F;&#x5B9E; Pipeline &#x9636;&#x6BB5;</div><div id="progressIteration" class="muted"></div><div id="stageList" class="stage-list"></div><p id="backgroundHint" class="muted">&#x4EFB;&#x52A1;&#x53EF;&#x5728;&#x540E;&#x53F0;&#x7EE7;&#x7EED;&#xFF0C;&#x8BF7;&#x52FF;&#x91CD;&#x590D;&#x63D0;&#x4EA4;</p></div><span id="status">等待中</span><h2>Eval Metrics</h2><div id="metrics" class="metrics"></div><h2>优化结果</h2><pre id="result"></pre><details><summary>编造审计</summary><pre id="audit"></pre></details><h2>Agent Trace</h2><table><thead><tr><th>Step</th><th>Agent</th><th>Round</th><th>Score</th><th>Latency</th><th>Status</th></tr></thead><tbody id="traces"></tbody></table></section>
</main><div class="actionbar"><span class="muted">材料仅发送到已配置的 Render API</span><button id="run">开始优化</button></div>
<script src="/app.js"></script></body></html>
